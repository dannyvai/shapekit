[project]
name = "photogrammetry"
version = "0.3.0"
description = "shapekit - Metashape-style photogrammetry from videos and photos (SIFT or ALIKED/SuperPoint/DISK + LightGlue, CUDA depth maps)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.10",
    "scikit-image>=0.22",
    # GPU stack: RTX 50xx (Blackwell, sm_120) needs PyTorch >= 2.7 built for CUDA 12.8
    "torch>=2.7",
    "torchvision>=0.22",
    "kornia>=0.7.3",
    "lightglue",
    # desktop GUI
    "pyside6>=6.8",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
lightglue = { git = "https://github.com/cvg/LightGlue" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
